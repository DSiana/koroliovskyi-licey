local_backend: true
backend:
  name: github
  repo: DSiana/koroliovskyi-licey
  branch: main

# Куди адмінка зберігатиме завантажені вами картинки та PDF-файли
media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  # ==========================================
  # 1. НАЛАШТУВАННЯ САЙТУ (settings.json)
  # ==========================================
  - name: "settings"
    label: "Налаштування сторінок"
    files:
      - label: "Головні налаштування"
        name: "main_settings"
        file: "data/settings.json"
        fields:
          - { label: "Фото директора", name: "directorPhoto", widget: "image" }
          - { label: "ПІБ директора", name: "directorPIB", widget: "string" }
          - {
              label: "Опис директора",
              name: "directorText",
              widget: "markdown",
            }
          - {
              label: "Текст на головній сторінці",
              name: "mainPageText",
              widget: "markdown",
            }
          - {
              label: "Текст на сторінці про заклад",
              name: "pronasText",
              widget: "markdown",
            }
          - {
              label: "Банер для Адміністрації",
              name: "adminBanner",
              widget: "image",
            }
          - {
              label: "Банер для Кафедри",
              name: "kafedryBanner",
              widget: "image",
            }

  # ==========================================
  # 2. НОВИНИ (novyny.json)
  # ==========================================
  - name: "news"
    label: "Новини"
    files:
      - label: "База новин"
        name: "news_data"
        file: "data/novyny.json"
        fields:
          - label: "Список новин"
            name: "items" # CMS запише всі новини у цей масив
            widget: "list"
            fields:
              - {
                  label: "ID (англійською, без пробілів, напр: svyato-vesny)",
                  name: "id",
                  widget: "string",
                }
              - { label: "Заголовок", name: "title", widget: "string" }
              - label: "Дата публікації"
                name: "date"
                widget: "datetime"
                format: "DD.MM.YYYY"
                date_format: "DD.MM.YYYY"
                time_format: false
              - { label: "Зображення", name: "image", widget: "image" }
              - { label: "Короткий опис", name: "summary", widget: "text" }
              - { label: "Повний текст", name: "content", widget: "markdown" }
              - {
                  label: "В архіві? (приховати)",
                  name: "archived",
                  widget: "boolean",
                  default: false,
                }

  # ==========================================
  # 3. КОЛЕКТИВ (colectyv.json)
  # ==========================================
  - name: "team"
    label: "Колектив"
    files:
      - label: "База працівників"
        name: "team_data"
        file: "data/colectyv.json"
        fields:
          - label: "Список працівників"
            name: "items"
            widget: "list"
            fields:
              - { label: "ПІБ", name: "pib", widget: "string" }
              - { label: "Посада", name: "position", widget: "string" }
              - { label: "Фото", name: "image", widget: "image" }
              - label: "Категорія (Куди додати?)"
                name: "category"
                widget: "select"
                options:
                  - { label: "Адміністрація", value: "admin" }
                  - { label: "Вчитель", value: "teacher" }

  # ==========================================
  # 4. ДОКУМЕНТИ (doc.json)
  # ==========================================
  - name: "documents"
    label: "Документи сайту"
    media_folder: "/public/assets/docs"
    public_folder: "/assets/docs"
    files:
      - label: "База документів"
        name: "doc_data"
        file: "data/doc.json"
        fields:
          - label: "Список файлів"
            name: "items"
            widget: "list"
            fields:
              - {
                  label: "Назва (напр: Статут ліцею)",
                  name: "title",
                  widget: "string",
                }
              - { label: "Файл (PDF)", name: "url", widget: "file" }
              - label: "Категорія (На якій сторінці показати документ?)"
                name: "category"
                widget: "select"
                options:
                  - { label: "Державні закупівлі", value: "derzh-zak" }
                  - { label: "Досягнення", value: "dosiagnenia" }
                  - { label: "Фінансові документи", value: "finansovi-doc" }
                  - { label: "Кадровий склад", value: "kadrovyj-sklad" }
                  - { label: "Методична робота", value: "metodychna-robota" }
                  - { label: "НУШ", value: "nush" }
                  - { label: "Освітня діяльність", value: "osvitnya-diyalnist" }
                  - { label: "Проєкти", value: "projekty" }
                  - { label: "Сторінка психолога", value: "psiholoh" }
                  - { label: "Стоп насильство", value: "stop-nasylstvo" }
                  - { label: "Структура", value: "struktura" }
                  - { label: "Територія", value: "terytoriya" }
                  - { label: "Умови доступності", value: "umovy-dostupnosti" }
                  - { label: "Установчі документи", value: "ustanovchi-doc" }
                  - { label: "Вступ", value: "vstup" }
                  - { label: "Виховна робота", value: "vyhovna-robota" }
                  - { label: "Звіти", value: "zvity" }
              - label: "Дата публікації"
                name: "date"
                widget: "datetime"
                format: "DD.MM.YYYY"
                date_format: "DD.MM.YYYY"
                time_format: false
  # ==========================================
  # 5. ГАЛЕРЕЯ (galereia.json)
  # ==========================================
  - name: "gallery"
    label: "Галерея"
    files:
      - label: "База фотографій"
        name: "gallery_data"
        file: "data/galereia.json"
        fields:
          - label: "Список фотографій"
            name: "items"
            widget: "list"
            fields:
              - { label: "Фотографія", name: "url", widget: "image" }
              - {
                  label: "Опис фото (alt-текст)",
                  name: "alt",
                  widget: "string",
                  required: false,
                }
